[project]
name = "libhippo"
version = "0.1.0"
description = "Permanent Knowledge Library for LLM with AutoGen 0.4"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "autogen-agentchat>=0.4.0",
    "autogen-core>=0.4.0",
    "autogen-ext[openai]>=0.4.0",
    "openai[realtime]>=1.60.0",
    "chromadb>=0.5.0",
    "pydantic>=2.7.0",
    "ruamel.yaml>=0.18.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "typesafe-sdk>=0.7.2",
    "python-dotenv>=1.2.3",
    "ddgs>=9.16.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libhippo"]
